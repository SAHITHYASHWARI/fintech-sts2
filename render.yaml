services:
  - type: web
    name: sts-fintech-backend
    env: node
    rootDir: ExpenseTrack1
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: web
    name: sts-fintech-frontend
    env: static
    rootDir: ExpenseTrack
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

